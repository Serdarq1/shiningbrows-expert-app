<div class="logout-wrap">
  <div class="spinner" aria-label="Çıkış yapılıyor"></div>
</div>

<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  .logout-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #e5e7eb;
    border-top-color: #111827;
    border-radius: 999px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="{{ clerk_key }}"
  src="https://organic-snapper-75.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"
></script>

<script>
  async function doLogout() {
    if (typeof Clerk === "undefined") {
      window.location.href = "/login";
      return;
    }
    try {
      await Clerk.load();
      await Clerk.signOut();
    } catch (err) {
      console.error(err);
    }
    window.location.href = "/login";
  }

  window.addEventListener("load", doLogout);
</script>
