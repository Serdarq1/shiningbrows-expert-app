{% extends "base.html" %}
{% block head %}
<script defer src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
<script defer src="{{ url_for('static', filename='js/live-workshop.js') }}"></script>
{% endblock %}
{% block content %}
<div class="min-h-screen px-4 py-8 md:px-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between gap-4">
      <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-semibold text-zinc-700 hover:text-zinc-900">
        <img src="{{ url_for('static', filename='img/logo-transparent.png') }}" alt="Shining Brows" class="h-10 w-10 object-contain">
        <span>Shining Brows</span>
      </a>
    </div>

    <section class="rounded-3xl border border-gray-200 bg-white/95 p-6 shadow-lg space-y-5">
      <div class="space-y-2">
        <p class="text-xs uppercase tracking-[0.25em] text-zinc-500">Canlı Workshop</p>
        <h1 id="live-workshop-title" class="text-3xl font-semibold">Workshop yükleniyor...</h1>
        <p id="live-workshop-meta" class="text-sm text-zinc-500"></p>
      </div>

      <div id="live-workshop-status" class="rounded-2xl border border-gold/40 bg-gold/10 px-4 py-3 text-sm text-zinc-700">
        Yayın bilgileri hazırlanıyor...
      </div>

      <form id="live-workshop-unlock-form" class="space-y-3 max-w-md">
        <label class="block space-y-2">
          <span class="text-sm font-semibold text-zinc-700">Yayın Şifresi</span>
          <input id="live-workshop-password" type="password" placeholder="Şifreyi girin" class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm outline-none focus:border-gold" required>
        </label>
        <button type="submit" class="rounded-xl bg-zinc-900 px-5 py-3 text-sm font-semibold text-white">Yayına Katıl</button>
      </form>

      <div id="live-workshop-player-wrap" class="hidden space-y-3">
        <div class="overflow-hidden rounded-3xl border border-gray-200 bg-black shadow-xl">
          <mux-player id="live-workshop-player" stream-type="live" metadata-video-title="Workshop" accent-color="#caa24a" class="w-full aspect-video"></mux-player>
        </div>
        <p class="text-xs text-zinc-500">Yayın başlamadıysa ekran kısa süre boş kalabilir.</p>
      </div>
    </section>
  </div>
</div>
<script>
  window.liveWorkshopSlug = {{ join_slug|tojson }};
</script>
{% endblock %}
