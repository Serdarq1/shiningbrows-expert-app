<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>Shining Brows Uzman Portalı</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="{{ url_for('static', filename='img/sb-logo.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/sb-logo.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Playfair Display"', '"Times New Roman"', 'serif'],
            body: ['"Manrope"', 'ui-sans-serif', 'system-ui'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              400: '#fb7185',
              500: '#f472b6',
              600: '#ec4899',
            },
            gold: {
              50: '#fff9e8',
              100: '#fcefc7',
              200: '#f7e3a3',
              400: '#e3c46b',
              500: '#caa24a',
              600: '#a8832f',
            },
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sb-gold: #caa24a;
      --sb-gold-soft: #f7e3a3;
      --sb-ink: #0f172a;
    }

    body {
      font-family: "Manrope", ui-sans-serif, system-ui;
      background:
        radial-gradient(900px 600px at 10% -10%, rgba(202, 162, 74, 0.18), transparent 60%),
        linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
    }

    html, body {
      background-color: #ffffff;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
    }

    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }

    a,
    button,
    [role="button"],
    input[type="button"],
    input[type="submit"] {
      touch-action: manipulation;
    }

    @media (max-width: 768px) {
      body {
        background: #ffffff;
      }
    }

    h1, h2, h3, h4, .font-display {
      font-family: "Playfair Display", "Times New Roman", serif;
      letter-spacing: 0.01em;
    }

    /* Subtle global accents */
    .border-gray-200 {
      border-color: rgba(202, 162, 74, 0.35);
    }

    .bg-zinc-900 {
      background-color: var(--sb-gold);
      background-image: linear-gradient(135deg, #d6b15c 0%, #b7882f 100%);
    }

    .bg-zinc-900:hover {
      filter: saturate(1.05);
    }

    .nav-btn.bg-zinc-900 {
      box-shadow: 0 8px 18px rgba(202, 162, 74, 0.25);
    }

    .hover\:bg-zinc-900:hover {
      background-color: var(--sb-gold);
      background-image: linear-gradient(135deg, #d6b15c 0%, #b7882f 100%);
    }

    .border-zinc-900 {
      border-color: var(--sb-gold);
    }

    .hover\:border-zinc-900:hover {
      border-color: var(--sb-gold);
    }

    .file\:bg-zinc-900::file-selector-button {
      background-color: var(--sb-gold);
      background-image: linear-gradient(135deg, #d6b15c 0%, #b7882f 100%);
      color: #ffffff;
    }

    .file\:bg-zinc-900::file-selector-button:hover {
      filter: saturate(1.05);
    }

    .text-gold { color: var(--sb-gold); }
    .bg-gold { background-color: var(--sb-gold); }
    .border-gold { border-color: var(--sb-gold); }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen text-zinc-900 font-body">
  <div class="min-h-screen">
    {% block content %}{% endblock %}
  </div>
  <script>
    (() => {
      let lastTouchEnd = 0;
      let lastActivation = 0;
      let lastActivationKey = "";

      const getActionableTarget = (target) => {
        if (!(target instanceof Element)) return null;
        return target.closest("a, button, [role='button'], input[type='button'], input[type='submit'], label[for], summary");
      };

      document.addEventListener("gesturestart", (event) => {
        event.preventDefault();
      });

      document.addEventListener(
        "touchmove",
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false }
      );

      document.addEventListener(
        "touchend",
        (event) => {
          const now = Date.now();
          if (now - lastTouchEnd < 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false }
      );

      document.addEventListener("dblclick", (event) => {
        event.preventDefault();
      });

      document.addEventListener(
        "click",
        (event) => {
          const target = getActionableTarget(event.target);
          if (!target) return;

          const now = Date.now();
          const activationKey = [
            target.tagName,
            target.id,
            target.getAttribute("href") || "",
            target.getAttribute("data-target") || "",
            target.getAttribute("type") || "",
            target.textContent ? target.textContent.trim().slice(0, 80) : "",
          ].join("|");

          if (activationKey === lastActivationKey && now - lastActivation < 350) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return;
          }

          lastActivation = now;
          lastActivationKey = activationKey;
        },
        true
      );
    })();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
