{% extends "base.html" %}

{% block content %}
  <div class="app-safe-top min-h-[100svh] flex flex-col px-6 py-8">
    <div class="flex-1 flex flex-col justify-center w-full mx-auto" style="max-width: 420px;">
      <div class="mb-8 text-center">
        <img src="{{ url_for('static', filename='img/sb-logo.png') }}" alt="Shining Brows" class="w-16 h-16 mx-auto mb-4 rounded-full object-cover">
        <h1 class="font-display text-2xl text-zinc-900">Giriş Yap</h1>
        <p class="text-sm text-zinc-600 mt-1">Hesabınıza erişmek için bilgilerinizi girin</p>
      </div>

      <form id="sign-in-form" class="space-y-4" data-step="sign-in" novalidate>
        <div id="sign-in-fields" class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-zinc-800 mb-1.5">E-posta</label>
            <input id="email" type="email" autocomplete="email" required
              class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-gold-400"
              placeholder="email@example.com">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-zinc-800 mb-1.5">Şifre</label>
            <div class="relative">
              <input id="password" type="password" autocomplete="current-password" required
                class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 pr-12 text-base focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-gold-400"
                placeholder="Şifrenizi girin">
              <button type="button" id="toggle-password" aria-label="Şifreyi göster/gizle"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500">
                <svg id="eye-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="text-right">
            <button type="button" id="forgot-password-link" class="text-sm text-gold-600 hover:underline">Şifremi unuttum</button>
          </div>
        </div>

        <div id="reset-request-fields" class="space-y-4 hidden">
          <p class="text-sm text-zinc-600">Şifrenizi sıfırlamak için e-posta adresinizi girin. Size bir doğrulama kodu göndereceğiz.</p>
          <div>
            <label for="reset-email" class="block text-sm font-medium text-zinc-800 mb-1.5">E-posta</label>
            <input id="reset-email" type="email" autocomplete="email"
              class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-gold-400"
              placeholder="email@example.com">
          </div>
        </div>

        <div id="reset-confirm-fields" class="space-y-4 hidden">
          <p class="text-sm text-zinc-600">E-postanıza gönderilen kodu ve yeni şifrenizi girin.</p>
          <div>
            <label for="reset-code" class="block text-sm font-medium text-zinc-800 mb-1.5">Doğrulama Kodu</label>
            <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code"
              class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-gold-400"
              placeholder="123456">
          </div>
          <div>
            <label for="reset-new-password" class="block text-sm font-medium text-zinc-800 mb-1.5">Yeni Şifre</label>
            <input id="reset-new-password" type="password" autocomplete="new-password"
              class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-gold-400"
              placeholder="Yeni şifrenizi girin">
          </div>
        </div>

        <div id="error-message" class="text-sm text-red-600 hidden"></div>

        <button type="submit" id="submit-button"
          class="w-full rounded-lg bg-zinc-900 text-white py-3 text-base font-medium disabled:opacity-60">
          Giriş Yap
        </button>

        <button type="button" id="back-link" class="w-full text-sm text-zinc-600 hidden">Geri</button>
      </form>

      <p class="text-center text-sm text-zinc-600 mt-6">
        Hesabınız yok mu? <a href="/sign-up" class="text-gold-600 font-medium hover:underline">Kayıt Ol</a>
      </p>
    </div>
  </div>

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="{{ clerk_key }}"
    src="{{ clerk_issuer or 'https://organic-snapper-75.clerk.accounts.dev' }}/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script src="/static/js/login.js"></script>
{% endblock %}
