
{% extends "base.html" %}

{% block content %}
  <div class="min-h-[100svh] flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div id="app"></div>
    </div>
  </div>
  <style>
    #app {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #app > div {
      width: 100%;
      max-width: 420px;
    }
  </style>

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="{{ clerk_key }}"
    src="{{ clerk_issuer or 'https://organic-snapper-75.clerk.accounts.dev' }}/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script src="/static/js/clerk.tr.js"></script>
  <script src="/static/js/login.js"></script>
{% endblock %}
